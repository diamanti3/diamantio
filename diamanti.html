<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .logo {
            font-size: 64px;
            color: #0000FF; /* Blue color */
            font-weight: bold;
        }
        .search-box {
            margin-top: 20px;
        }
        .search-box input[type="text"] {
            width: 400px;
            padding: 10px;
            font-size: 18px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
            outline: none;
        }
        .search-box input[type="submit"] {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #0000FF; /* Blue color */
            color: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="logo">Diamant</div>
    <div class="search-box">
        <form action="https://www.diamant.com/search" method="get">
            <input type="text" name="q" placeholder="Search...">
            <input type="submit" value="Search">
        </form>
    </div>
</body>
</html>
